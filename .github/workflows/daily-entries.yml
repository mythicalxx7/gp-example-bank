name: Add daily examples

on:
  schedule:
    # 23:10 UTC = 07:10 Singapore time. GitHub cron is best-effort and often
    # runs late; that is fine for a daily job.
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many examples to look for"
        required: false
        default: "20"
      dry_run:
        description: "Print without committing (true/false)"
        required: false
        default: "false"
      model:
        description: "Model id (blank = gemini-3.5-flash)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-entries
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch new examples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENTRY_COUNT: ${{ github.event.inputs.count || '20' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          MODEL: ${{ github.event.inputs.model }}
        run: node scripts/add-entries.mjs

      # Commits whenever the data file actually changed. DRY_RUN stops the
      # script writing at all, so no extra condition is needed here.
      - name: Commit
        run: |
          if git diff --quiet -- data/entries.json; then
            echo "No change to data/entries.json — nothing to commit."
            exit 0
          fi
          ADDED=$(git diff --numstat -- data/entries.json | awk '{print $1}')
          echo "data/entries.json changed (+$ADDED lines). Committing."
          git config user.name  "example-bank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/entries.json
          git commit -m "Add examples for $(date -u +%Y-%m-%d)"
          git push
